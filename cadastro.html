<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Criar conta — Como Faz?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,500;0,600;0,700;1,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="wrap topbar__row">
    <a href="index.html" class="brand">Como<span class="brand__dot">Faz?</span></a>
    <nav class="nav-auth" id="navAuthArea"></nav>
  </div>
</header>

<main class="auth-page">
  <div class="auth-card">
    <p class="eyebrow-free">bem-vindo</p>
    <h1>Criar sua conta</h1>
    <p class="auth-card__lede">Salve seus processos e acompanhe de onde parou.</p>

    <form id="formCadastro" class="auth-form">
      <label for="nome">Nome</label>
      <input type="text" id="nome" required autocomplete="name">

      <label for="email">E-mail</label>
      <input type="email" id="email" required autocomplete="email">

      <label for="senha">Senha</label>
      <input type="password" id="senha" required minlength="6" autocomplete="new-password">
      <span class="auth-form__hint">Mínimo de 6 caracteres.</span>

      <button type="submit">Criar conta</button>
      <p class="auth-form__msg" id="mensagem"></p>
    </form>

    <p class="auth-card__switch">Já tem conta? <a href="login.html">Entrar</a></p>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabaseClient.js"></script>
<script src="auth.js"></script>
<script>
document.getElementById('formCadastro').addEventListener('submit', async (e) => {
  e.preventDefault();
  const nome = document.getElementById('nome').value.trim();
  const email = document.getElementById('email').value.trim();
  const senha = document.getElementById('senha').value;
  const msg = document.getElementById('mensagem');

  msg.textContent = 'Criando conta...';
  msg.className = 'auth-form__msg';

  const { data, error } = await supabaseClient.auth.signUp({
    email,
    password: senha,
    options: { data: { nome } }
  });

  if (error) {
    msg.textContent = 'Não foi possível criar a conta: ' + error.message;
    msg.className = 'auth-form__msg auth-form__msg--error';
    return;
  }

  msg.textContent = 'Conta criada! Se a confirmação por e-mail estiver ativa, confira sua caixa de entrada antes de entrar.';
  msg.className = 'auth-form__msg auth-form__msg--ok';
});
</script>
</body>
</html>
