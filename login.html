<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — Como Faz?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,500;0,600;0,700;1,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="wrap topbar__row">
    <a href="index.html" class="brand">Como<span class="brand__dot">Faz?</span></a>
    <nav class="nav-auth" id="navAuthArea"></nav>
  </div>
</header>

<main class="auth-page">
  <div class="auth-card">
    <p class="eyebrow-free">que bom te ver de novo</p>
    <h1>Entrar na sua conta</h1>
    <p class="auth-card__lede">Continue de onde parou nos seus processos.</p>

    <form id="formLogin" class="auth-form">
      <label for="email">E-mail</label>
      <input type="email" id="email" required autocomplete="email">

      <label for="senha">Senha</label>
      <input type="password" id="senha" required autocomplete="current-password">

      <button type="submit">Entrar</button>
      <p class="auth-form__msg" id="mensagem"></p>
    </form>

    <p class="auth-card__switch">Ainda não tem conta? <a href="cadastro.html">Criar conta</a></p>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabaseClient.js"></script>
<script src="auth.js"></script>
<script>
document.getElementById('formLogin').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const senha = document.getElementById('senha').value;
  const msg = document.getElementById('mensagem');

  msg.textContent = 'Entrando...';
  msg.className = 'auth-form__msg';

  const { data, error } = await supabaseClient.auth.signInWithPassword({
    email,
    password: senha
  });

  if (error) {
    msg.textContent = 'Não foi possível entrar: ' + error.message;
    msg.className = 'auth-form__msg auth-form__msg--error';
    return;
  }

  window.location.href = 'minha-conta.html';
});
</script>
</body>
</html>
